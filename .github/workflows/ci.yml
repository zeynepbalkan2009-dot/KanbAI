name: KanbAI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure local runtime files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files \
            '.env' \
            'infra/nginx/certs/*.crt' \
            'infra/nginx/certs/*.key' \
            'mlops/registry/*.json' \
            'outputs/*' \
            'web/.next/*' \
            'web/node_modules/*' || true)"

          if [ -n "$forbidden" ]; then
            echo "Forbidden runtime/generated files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Run public release guard
        shell: pwsh
        run: ./scripts/public-release-guard.ps1

  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse backend and MLOps Python files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import pathlib
          import sys

          roots = [pathlib.Path("backend"), pathlib.Path("mlops"), pathlib.Path("scripts")]
          excluded_parts = {".venv", "venv", "__pycache__"}
          failures = []
          checked = 0

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.py"):
                  if any(part in excluded_parts for part in path.parts):
                      continue
                  checked += 1
                  try:
                      ast.parse(path.read_text(encoding="utf-8"))
                  except SyntaxError as exc:
                      failures.append(f"{path}:{exc.lineno}:{exc.offset}: {exc.msg}")

          if failures:
              print("Python syntax failures:")
              print("\n".join(failures))
              sys.exit(1)

          print(f"Parsed {checked} Python files successfully.")
          PY

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-demo-smoke:
    name: Docker demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - repository-hygiene
      - backend-syntax
      - web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare demo environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path

          path = Path(".env")
          values = {}
          for line in path.read_text().splitlines():
              if "=" in line and not line.lstrip().startswith("#"):
                  key, value = line.split("=", 1)
                  values[key] = value

          values.update({
              "APP_ENV": "development",
              "DEMO_MODE": "true",
              "AI_INFERENCE_MODE": "mock",
              "AI_MOCK_DELAY_MIN": "0.1",
              "AI_MOCK_DELAY_MAX": "0.2",
              "NEXT_PUBLIC_API_URL": "",
              "NEXT_PUBLIC_WS_URL": "",
          })

          path.write_text("\n".join(f"{key}={value}" for key, value in values.items()) + "\n")
          PY

      - name: Build and start demo stack
        shell: bash
        run: docker compose up -d --build

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8000/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color api
          exit 1

      - name: Run database migration
        shell: bash
        run: docker compose exec -T api alembic upgrade head

      - name: Run factory demo acceptance smoke test
        shell: pwsh
        run: |
          ./scripts/smoke-test.ps1 `
            -ApiBaseUrl 'http://localhost:8000' `
            -WebBaseUrl 'http://localhost' `
            -SeedCount 6

      - name: Switch the live stack to pilot mode
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".env")
          values = {}
          for line in path.read_text().splitlines():
              if "=" in line and not line.lstrip().startswith("#"):
                  key, value = line.split("=", 1)
                  values[key] = value

          values["DEMO_MODE"] = "true"
          values["PILOT_MODE"] = "true"
          path.write_text("\n".join(f"{key}={value}" for key, value in values.items()) + "\n")
          PY
          docker compose up -d --force-recreate api

      - name: Wait for pilot API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8000/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color api
          exit 1

      - name: Run pilot mode safety smoke test
        shell: pwsh
        run: |
          ./scripts/pilot-mode-smoke-test.ps1 `
            -ApiBaseUrl 'http://localhost:8000' `
            -Email 'admin@demo.com' `
            -Password 'Admin123!'
          $apiLogs = docker compose logs --no-color api
          if (-not ($apiLogs -match 'demo_seed_skipped_for_pilot_mode')) {
            throw 'Pilot startup did not record demo seed suppression.'
          }

      - name: Print compose logs on failure
        if: failure()
        shell: bash
        run: docker compose logs --no-color --tail=200

      - name: Stop compose stack
        if: always()
        shell: bash
        run: docker compose down -v
